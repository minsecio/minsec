d /run/minsec 0750 minsec minsec -
d /var/lib/minsec 0750 minsec minsec -

# Web server logs the adm group cannot read: EL httpd and nginx, Virtualmin
# per-domain logs. The explicit mask survives chmod by other packages'
# tmpfiles lines. No default ACLs: they change chmod semantics for files
# created later and break group write after chown/chmod.
a+ /var/log/httpd        - - - - u:minsec:rx,m::rx
a+ /var/log/nginx        - - - - u:minsec:rx,m::rx
a+ /var/log/nginx/*      - - - - u:minsec:r
a+ /var/log/virtualmin   - - - - u:minsec:rx,m::rx
a+ /var/log/virtualmin/* - - - - u:minsec:r
