d /run/minsec 0750 minsec minsec -
d /var/lib/minsec 0750 minsec minsec -

# Web server logs the adm group cannot read: EL httpd and nginx, Virtualmin
# per-domain logs. The default ACL (d:) covers files created later.
a+ /var/log/httpd        - - - - u:minsec:rx
a+ /var/log/nginx        - - - - u:minsec:rx,d:u:minsec:r
a+ /var/log/nginx/*      - - - - u:minsec:r
a+ /var/log/virtualmin   - - - - u:minsec:rx,d:u:minsec:r
a+ /var/log/virtualmin/* - - - - u:minsec:r
