name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GLIBC_FLOOR: "2.28"   # EL8; everything newer (EL9/10, Debian 11+, Ubuntu 22.04+) is covered

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            deb_arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${GITHUB_REF_NAME#v}
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="minsec") | .version')
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate — cut releases with scripts/release.sh"
            exit 1
          fi
      - name: Install packaging tools
        run: |
          # Exact versions: these tools produce the release artifacts, so an
          # upstream release must not silently change what we ship. Bump
          # deliberately.
          pip install ziglang==0.16.0
          cargo install --locked cargo-zigbuild@0.23.0 cargo-deb@3.7.0 cargo-generate-rpm@0.21.0
      - name: Build (glibc ${{ env.GLIBC_FLOOR }})
        run: |
          cargo zigbuild --release --target ${{ matrix.target }}.${{ env.GLIBC_FLOOR }} -p minsec -p minsec-sync
          # cargo-deb/generate-rpm look under target/release by default; give them the cross build.
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/minsec target/release/minsec
          cp target/${{ matrix.target }}/release/minsec-sync target/release/minsec-sync
      - name: Verify dependency floor
        run: |
          scripts/check-glibc.sh target/release/minsec ${{ env.GLIBC_FLOOR }}
          scripts/check-glibc.sh target/release/minsec-sync ${{ env.GLIBC_FLOOR }}
      - name: Package
        run: |
          cargo deb -p minsec --no-build --no-strip --target ${{ matrix.target }}
          cargo generate-rpm -p crates/minsec --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/debian/*.deb dist/
          cp target/${{ matrix.target }}/generate-rpm/*.rpm dist/
          cp target/release/minsec dist/minsec-${{ matrix.arch }}
          cp target/release/minsec-sync dist/minsec-sync-${{ matrix.arch }}
          ls -la dist
      - name: Inspect packages
        run: |
          for f in dist/*.deb; do dpkg-deb --info "$f" | sed -n '1,25p'; dpkg-deb --contents "$f"; done
          sudo apt-get install -y rpm >/dev/null
          for f in dist/*.rpm; do rpm -qip "$f"; rpm -qlp "$f"; rpm -qp --requires "$f"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*

  smoke:
    name: install smoke (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["almalinux:8", "almalinux:9", "almalinux:10", "debian:12", "ubuntu:22.04", "ubuntu:24.04"]
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages-x86_64
          path: dist
      - name: Install and run
        run: |
          set -e
          if command -v dnf >/dev/null; then
            dnf install -y dist/*.x86_64.rpm
          else
            apt-get update -qq && apt-get install -y -qq ./dist/*_amd64.deb
          fi
          minsec --version
          minsec-sync --version
          for command in minsec minsec-sync; do
            test -s /usr/share/bash-completion/completions/$command
            test -s /usr/share/fish/vendor_completions.d/$command.fish
            if command -v dnf >/dev/null; then
              test -s /usr/share/zsh/site-functions/_$command
            else
              test -s /usr/share/zsh/vendor-completions/_$command
            fi
          done
          bash -c '
            source /usr/share/bash-completion/completions/minsec
            source /usr/share/bash-completion/completions/minsec-sync
            COMP_WORDS=(minsec che); COMP_CWORD=1; _minsec minsec che minsec
            [[ " ${COMPREPLY[*]} " == *" check "* ]] || exit 1
            COMP_WORDS=(minsec ban --t); COMP_CWORD=2; _minsec minsec --t ban
            [[ " ${COMPREPLY[*]} " == *" --ttl "* ]] || exit 1
            COMP_WORDS=(minsec-sync pu); COMP_CWORD=1; _minsec_sync minsec-sync pu minsec-sync
            [[ " ${COMPREPLY[*]} " == *" pull "* ]] || exit 1
            COMP_WORDS=(minsec-sync pull --d); COMP_CWORD=2; _minsec_sync minsec-sync --d pull
            [[ " ${COMPREPLY[*]} " == *" --dry-run "* ]] || exit 1
          '
          minsec-sync run   # multiplayer not configured: must exit 0 quietly
          minsec check
          minsec filters
          echo 'sshd[1]: Failed password for root from 198.51.100.7 port 1 ssh2' | minsec test sshd - -q

  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir -p dist && cp artifacts/*/* dist/
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
      # minsec.io shows the latest release on its install page; tell it to
      # rebuild now rather than wait for its daily schedule. The run's own
      # token cannot reach another repository, so a short-lived one is minted
      # from the org-owned "minsec release" GitHub App, which is installed on
      # minsecio/minsec.io alone with Contents: write (what repository_dispatch
      # requires). Secrets on this repo: SITE_APP_ID, SITE_APP_PRIVATE_KEY.
      # The site rebuilds daily anyway, so a failure here must not fail the
      # release.
      - name: Mint minsec.io token
        id: site-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SITE_APP_ID }}
          private-key: ${{ secrets.SITE_APP_PRIVATE_KEY }}
          owner: minsecio
          repositories: minsec.io
          permission-contents: write
      - name: Rebuild minsec.io
        if: steps.site-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.site-token.outputs.token }}
        run: gh api repos/minsecio/minsec.io/dispatches -f event_type=agent-release
